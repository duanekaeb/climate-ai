# XcodeGen spec for the Climate AI iOS wrapper.
#   brew install xcodegen
#   cd ios && xcodegen          # writes ClimateAI.xcodeproj (not committed)
#   open ClimateAI.xcodeproj
# Before running on a device: change PRODUCT_BUNDLE_IDENTIFIER below to your own reverse-DNS
# id and pick your team in Signing & Capabilities (or set DEVELOPMENT_TEAM here).
name: ClimateAI
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ClimateAI:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ClimateAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.climateai
        PRODUCT_NAME: ClimateAI
        INFOPLIST_FILE: ClimateAI/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: YES
schemes:
  ClimateAI:
    build:
      targets:
        ClimateAI: all
    run:
      config: Debug
    archive:
      config: Release
