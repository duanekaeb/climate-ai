[project]
name = "climate"
version = "0.1.0"
description = "Whole-house optimizer for three ecobee thermostats: monitoring, analytics, learning and a guarded controller."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.1.3",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
    "numpy==2.4.6",
    "scipy==1.17.1",
    "cryptography==50.0.2",
    "itsdangerous>=2.2",
    "python-ecobee-api==0.4.2",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
# HomeKit runs in its own host-networked container; keep it optional so the
# rest of the stack installs without mDNS/BLE dependencies.
homekit = ["aiohomekit==4.0.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["climate*"]

[tool.setuptools.package-data]
"climate.store" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
