# Climate AI behind an nginx running IN DOCKER, at home (LAN / Tailscale).
#
# NOT for the GrowWise AppRelay gateway (the public name https://climate.apprelay.net). That
# gateway generates Climate's server block from its apps.conf, and Climate's extra rules (HTTPS
# only + HSTS, a sign-in rate limit, no published API docs) live in the growwise-ai repo at
# apprelay/gateway/nginx/snippets/apps/climate.conf. Nothing in this directory is copied there;
# Climate's side is only docker-compose.nginx.yml and .env. See docs/PUBLIC_ACCESS.md.
#
# This file is for some other nginx container of yours, with its own certificates. It is
# written for a private name; if a server block like this ever faces the internet, give it the
# same protections as the AppRelay snippet above, and never without the app's owner password
# already chosen.
#
# 1. Put the app on nginx's Docker network (docker-compose.nginx.yml). In .env:
#      NGINX_NETWORK=<nginx's network from `docker network ls`>
#      COMPOSE_FILE=docker-compose.yml:docker-compose.nginx.yml
#    then: docker compose up -d
#    The app is now reachable from nginx as climate-ai-app:8000 (a network alias; the
#    container name is climate-ai-app-1). FORWARDED_ALLOW_IPS in .env must cover nginx's
#    address on that network (its subnet: `docker network inspect <network>`), or the app
#    takes every visitor for nginx itself, a private "home" address.
# 2. Copy this file into the directory your nginx container includes (often a bind mount of
#    /etc/nginx/conf.d), edit server_name and TLS, then:
#      docker exec <nginx-container> nginx -t && docker exec <nginx-container> nginx -s reload
#
# The upstream is resolved at request time through Docker's embedded DNS (127.0.0.11), so
# nginx still starts while Climate AI is down or being rebuilt (it answers 502 until the app
# is back) instead of refusing to start with "host not found in upstream".

server {
    listen 80;
    # listen [::]:80;                 # uncomment if your other server blocks listen on IPv6
    # --- TLS: reuse your GrowWise server blocks' certificate setup, e.g.
    # listen 443 ssl;
    # listen [::]:443 ssl;
    # http2 on;                         # nginx >= 1.25.1; older: "listen 443 ssl http2;"
    # ssl_certificate     /etc/nginx/certs/example.home/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/example.home/privkey.pem;
    # Behind HTTPS keep CLIMATE_COOKIE_SECURE=true in .env (the default).

    server_name climate.example.home;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $climate_upstream http://climate-ai-app:8000;

    # --- Keep it private: LAN + Tailscale only. Note that inside Docker $remote_addr is the
    # real client only if nginx publishes its ports normally (not via a userland proxy that
    # rewrites source addresses); check `docker logs <nginx>` before relying on this.
    # allow 192.168.0.0/16;
    # allow 10.0.0.0/8;
    # allow 172.16.0.0/12;
    # allow 100.64.0.0/10;              # Tailscale (CGNAT range)
    # deny all;

    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json
               application/manifest+json image/svg+xml;

    location /api/ws {
        proxy_pass $climate_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Overwrite (not append): uvicorn trusts X-Forwarded-For and the login throttle is
        # per client IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location /assets/ {
        proxy_pass $climate_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass $climate_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
