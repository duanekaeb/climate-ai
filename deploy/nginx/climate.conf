# Climate AI behind an nginx running ON THE HOST (the same nginx that fronts your GrowWise
# services). The app container publishes 127.0.0.1:8470 (APP_PORT in .env).
#
# Install (Debian/Ubuntu layout; adapt to yours):
#   sudo cp deploy/nginx/climate.conf /etc/nginx/conf.d/climate.conf
#     (or sites-available/ + a symlink in sites-enabled/)
#   edit server_name (and TLS below), then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# This file belongs in the http{} context (conf.d/*.conf and sites-enabled/* already are).
# All names are prefixed climate_ so nothing collides with your existing config.
#
# If nginx runs in Docker instead, use climate-docker-network.conf.

upstream climate_ai_app {
    server 127.0.0.1:8470;
    keepalive 8;
}

# Optional: plain-http -> https redirect once TLS is on (then drop `listen 80` from the main
# server block below so the two don't both claim port 80 for this name).
# server {
#     listen 80;
#     # listen [::]:80;
#     server_name climate.example.home;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    # listen [::]:80;                 # uncomment if your other server blocks listen on IPv6
    # --- TLS: reuse exactly what your GrowWise server blocks use (same wildcard cert,
    # certbot/acme.sh paths, ssl_protocols, includes). For example:
    # listen 443 ssl;
    # listen [::]:443 ssl;
    # http2 on;                         # nginx >= 1.25.1; older: "listen 443 ssl http2;"
    # ssl_certificate     /etc/letsencrypt/live/example.home/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/example.home/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # Behind HTTPS keep CLIMATE_COOKIE_SECURE=true in .env (the default).

    # Placeholder: a name your phones resolve on the LAN / over Tailscale.
    server_name climate.example.home;

    # --- Keep it private: LAN + Tailscale only. Do not port-forward this to the internet.
    # allow 127.0.0.1;
    # allow 192.168.0.0/16;
    # allow 10.0.0.0/8;
    # allow 172.16.0.0/12;
    # allow 100.64.0.0/10;              # Tailscale (CGNAT range)
    # allow fd7a:115c:a1e0::/48;        # Tailscale IPv6
    # deny all;

    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json
               application/manifest+json image/svg+xml;

    # Websocket: live updates. HTTP/1.1 upgrade, long read timeout (the server pings, but
    # an idle house can be quiet for a while).
    location /api/ws {
        proxy_pass http://climate_ai_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Overwrite (not append): uvicorn trusts X-Forwarded-For, and the login throttle is
        # per client IP, so a client must not be able to supply its own value.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # Hashed build assets never change: cache hard.
    location /assets/ {
        proxy_pass http://climate_ai_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API + web app (the app serves index.html for client-side routes).
    location / {
        proxy_pass http://climate_ai_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Backtests and simulations are synchronous but bounded.
        proxy_read_timeout 120s;
    }
}
